{% set name = "werkzeug" %}
{% set version = "3.1.9" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 55ca7c70a75689be937aa27f8ff4b018f06ff4838fc73045560bf0f5a1291060

build:
  number: 0
  skip: True  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -v

requirements:
  host:
    - python
    - pip
    - flit-core >=3.11,<5
  run:
    - python
    - markupsafe >=2.1.1
  run_constrained:
    - watchdog >=2.3

test:
  imports:
    - werkzeug
    - werkzeug.debug
  requires:
    - pip
  commands:
    - pip check
    # No pytest run: tests/conftest.py imports ephemeral_port_reserve at top level
    # (whole suite fails to collect without it), and ephemeral-port-reserve is not
    # on pkgs/main.

about:
  home: https://palletsprojects.com/p/werkzeug
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: The comprehensive WSGI web application library.
  description: |
    Werkzeug is a WSGI utility library for Python. It's widely used and BSD licensed.
  doc_url: https://werkzeug.palletsprojects.com
  dev_url: https://github.com/pallets/werkzeug

extra:
  recipe-maintainers:
    - goanpeca
    - mcs07
